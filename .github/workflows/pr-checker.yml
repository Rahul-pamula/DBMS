name: PR Issue Checker 🤖 (L3 — Auto Merge)

on:
  pull_request:
    types: [opened, synchronize, reopened]

  schedule:
    - cron: '0 */6 * * *'   # every 6 hours

  workflow_dispatch:
    inputs:
      auto_merge:
        description: 'Enable auto-merge? (true/false)'
        required: false
        default: 'true'

jobs:
  check-and-merge:
    runs-on: ubuntu-latest

    permissions:
      pull-requests: write   # post comments on PRs
      issues: read           # read issue details
      contents: write        # ← NEEDED FOR MERGE (L3)

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run PR Issue Checker (L3)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTO_MERGE: ${{ github.event.inputs.auto_merge || 'true' }}
        run: python .github/scripts/check_pr.py
